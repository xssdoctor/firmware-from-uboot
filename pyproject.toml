[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-from-uboot"
version = "0.1.0"
description = "Dump SPI NOR firmware through an authorized U-Boot serial console"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
firmware-from-uboot = "spidump:main"

[tool.setuptools]
py-modules = ["spidump"]
